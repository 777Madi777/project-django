{% extends 'base.html' %}

{% block title %}Запись к доктору{% endblock %}

{% block content %}
<div class="container">
    <h2 class="text-center mb-4">Запись к доктору: {{ doctor.first_name }} {{ doctor.last_name }}</h2>

    <form method="post" class="row g-3 justify-content-center">
        {% csrf_token %}
        <div class="col-md-6">
            <label for="slot" class="form-label">Выберите время:</label>
            <select name="slot" id="slot" class="form-select" required>
                {% for slot in available_slots %}
                    <option value="{{ slot|date:'c' }}">{{ slot|date:"d.m.Y H:i" }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-12 text-center">
            <button type="submit" class="btn btn-primary mt-3">Записаться</button>
        </div>
    </form>
</div>
{% endblock %}
