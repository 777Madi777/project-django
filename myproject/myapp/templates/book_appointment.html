{% extends 'base.html' %}
{% block content %}
<h2>Запись к доктору {{ doctor.get_full_name }}</h2>

<form method="post">
    {% csrf_token %}
    <label for="slot">Выберите время:</label>
    <select name="slot" required>
        {% for slot in available_slots %}
            <option value="{{ slot|date:'c' }}">{{ slot|date:"d.m.Y H:i" }}</option>
        {% endfor %}
    </select>
    <button type="submit">Записаться</button>
</form>
{% endblock %}
